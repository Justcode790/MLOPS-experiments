name: Stage 6 - Continuous Delivery (release candidate)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["stage6_continuous_delivery/**", "data/**", ".github/workflows/stage6-continuous-delivery.yml"]
  pull_request:
    branches: [main]
    paths: ["stage6_continuous_delivery/**", "data/**"]

permissions:
  contents: read

defaults:
  run:
    working-directory: stage6_continuous_delivery

jobs:
  train-test-deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Titanic model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline.py -v

      - name: Run prediction application tests
        run: python -m unittest test_app.py -v

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py titanic_model.pkl metrics.json requirements.txt release_candidate/
          printf "Titanic Survival Prediction ML Application\nRun: pip install -r requirements.txt && python app.py\nEndpoint: POST /predict\n" > release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: titanic-ml-release
          path: stage6_continuous_delivery/release_candidate/
          if-no-files-found: error
          retention-days: 7
