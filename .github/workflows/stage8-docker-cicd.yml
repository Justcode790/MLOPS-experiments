name: Stage 8 - Docker build and container tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["stage8_docker_cicd/**", "data/**", ".github/workflows/stage8-docker-cicd.yml"]
  pull_request:
    branches: [main]
    paths: ["stage8_docker_cicd/**", "data/**"]

permissions:
  contents: read

defaults:
  run:
    working-directory: stage8_docker_cicd

jobs:
  train-test-containerize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Titanic model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated tests
        run: python -m unittest discover -v

      - name: Build Docker image
        run: docker build -t titanic-survival-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name titanic-survival-ml-container \
            -p 5000:5000 \
            titanic-survival-ml:${{ github.sha }}

      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo ""
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done
          echo "Application did not become ready."
          docker logs titanic-survival-ml-container
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"pclass":1,"sex":"female","age":28,"sibsp":0,"parch":0,"fare":100,"embarked":"C"}' \
            http://localhost:5000/predict)
          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      - name: Show Docker container logs
        if: always()
        run: docker logs titanic-survival-ml-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f titanic-survival-ml-container || true
